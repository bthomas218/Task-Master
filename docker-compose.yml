services:
  postgres:
    image: postgres:17-alpine
    container_name: task-master-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: task_master
      POSTGRES_PASSWORD: task_master
      POSTGRES_DB: task_master
    ports:
      - "5432:5432"
    volumes:
      - task-master-postgres-data:/var/lib/postgresql/data

volumes:
  task-master-postgres-data:
